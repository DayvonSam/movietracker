<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎬 My Movie Tracker</h1>

  <form id="movieForm">
    <input type="text" id="title" placeholder="Movie Title" required>
    <input type="number" id="year" placeholder="Release Year" required>
    <textarea id="description" placeholder="Short Description"></textarea>
    <button type="submit">Add Movie</button>
  </form>

  <h2>Movie List</h2>
  <div id="movieList"></div>

  <script src="script.js"></script>
</body>
</html>
